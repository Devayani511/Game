<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe - User vs Computer</title>

<style>
body{
    font-family: Arial, sans-serif;
    text-align:center;
    background:#0f172a;
    color:white;
}

h1{ margin-top:30px; }

.board{
    display:grid;
    grid-template-columns:repeat(3,100px);
    gap:10px;
    justify-content:center;
    margin-top:30px;
}

.cell{
    width:100px;
    height:100px;
    background:#1e293b;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:40px;
    cursor:pointer;
    border-radius:10px;
}

.cell:hover{
    background:#334155;
}

button{
    margin-top:20px;
    padding:10px 20px;
    font-size:16px;
    border:none;
    border-radius:5px;
    cursor:pointer;
}
</style>
</head>

<body>

<h1>Tic Tac Toe</h1>
<h2 id="status">Your Turn (X)</h2>

<div class="board">
    <div class="cell" onclick="playerMove(0)"></div>
    <div class="cell" onclick="playerMove(1)"></div>
    <div class="cell" onclick="playerMove(2)"></div>
    <div class="cell" onclick="playerMove(3)"></div>
    <div class="cell" onclick="playerMove(4)"></div>
    <div class="cell" onclick="playerMove(5)"></div>
    <div class="cell" onclick="playerMove(6)"></div>
    <div class="cell" onclick="playerMove(7)"></div>
    <div class="cell" onclick="playerMove(8)"></div>
</div>

<button onclick="resetGame()">Restart Game</button>

<script>
let board = ["","","","","","","","",""];
let gameActive = true;

const winPatterns = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
];

function playerMove(index){
    if(board[index] !== "" || !gameActive) return;

    board[index] = "X";
    updateBoard();

    if(checkWinner("X")){
        document.getElementById("status").innerText = "You Win!";
        gameActive = false;
        return;
    }

    if(!board.includes("")){
        document.getElementById("status").innerText = "It's a Draw!";
        gameActive = false;
        return;
    }

    document.getElementById("status").innerText = "Computer's Turn (O)";
    setTimeout(computerMove, 500);
}

function computerMove(){
    let emptyCells = board.map((val, idx) => val === "" ? idx : null)
                          .filter(val => val !== null);

    if(emptyCells.length === 0) return;

    let randomIndex = emptyCells[Math.floor(Math.random() * emptyCells.length)];
    board[randomIndex] = "O";
    updateBoard();

    if(checkWinner("O")){
        document.getElementById("status").innerText = "Computer Wins!";
        gameActive = false;
        return;
    }

    if(!board.includes("")){
        document.getElementById("status").innerText = "It's a Draw!";
        gameActive = false;
        return;
    }

    document.getElementById("status").innerText = "Your Turn (X)";
}

function updateBoard(){
    document.querySelectorAll(".cell").forEach((cell, index)=>{
        cell.innerText = board[index];
    });
}

function checkWinner(player){
    return winPatterns.some(pattern=>{
        return pattern.every(index => board[index] === player);
    });
}

function resetGame(){
    board = ["","","","","","","","",""];
    gameActive = true;
    document.getElementById("status").innerText = "Your Turn (X)";
    updateBoard();
}
</script>

</body>
</html>
